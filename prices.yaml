# List prices in USD per 1M tokens, used only for the cost columns in reports.
# Sources and dates are recorded per provider; update `as_of` when changing.
default_batch_discount: 0.5
providers:
  typesafe:
    _source: https://docs.typesafe.ai/models (read 2026-09-17); output tokens are free
    jev-1.13.0: {input: 0.042, output: 0.0}
