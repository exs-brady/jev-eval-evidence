    _source: Anthropic first-party API price table (cached in the claude-api reference, 2026-06-24); Batch API 50% off
    claude-opus-5: {input: 5.00, output: 25.00, batch_discount: 0.5}
    claude-sonnet-5: {input: 2.00, output: 10.00, batch_discount: 0.5}
    claude-sonnet-4-5: {input: 3.00, output: 15.00, batch_discount: 0.5}
    claude-haiku-4-5: {input: 1.00, output: 5.00, batch_discount: 0.5}
