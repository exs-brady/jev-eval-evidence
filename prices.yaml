    _source: https://developers.openai.com/api/docs/pricing (read 2026-09-17); Batch API 50% off
    gpt-5.5: {input: 5.00, output: 30.00, batch_discount: 0.5}
    gpt-5.4: {input: 2.50, output: 15.00, batch_discount: 0.5}
    gpt-5.4-mini: {input: 0.75, output: 4.50, batch_discount: 0.5}
    gpt-5.4-nano: {input: 0.20, output: 1.25, batch_discount: 0.5}
    gpt-5: {input: 1.25, output: 10.00, batch_discount: 0.5}
    gpt-5-mini: {input: 0.25, output: 2.00, batch_discount: 0.5}
    gpt-4.1: {input: 2.00, output: 8.00, batch_discount: 0.5}
    gpt-4.1-mini: {input: 0.40, output: 1.60, batch_discount: 0.5}
    gpt-4o: {input: 2.50, output: 10.00, batch_discount: 0.5}
    o4-mini: {input: 1.10, output: 4.40, batch_discount: 0.5}
